[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analyst-agent"
version = "0.1.0"
description = "Data analysis chat assistant for retail executives (OpsFleet assignment)"
requires-python = ">=3.11"

[project.scripts]
retail-agent = "agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long strings and SQL read better unbroken

[tool.pytest.ini_options]
testpaths = ["tests"]
